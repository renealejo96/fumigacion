services:
  - type: web
    name: fumigacion-app
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python init_db.py"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 run:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fumigacion-db
          property: connectionString

databases:
  - name: fumigacion-db
    plan: free
    databaseName: fumigacion
    user: fumigacion_user
